<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Browser Guess: Souls-like Edition</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0d;--panel:#171717;--border:#33291e;--gold:#c5a880;--gold-glow:#f3e2c4;--crimson:#8b0000;--dark-red:#4a0505;--text:#d1c7bd;--muted:#887e75}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Rajdhani',system-ui,sans-serif;color:var(--text);background:var(--bg);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.hidden{display:none!important}
button{font:inherit;cursor:pointer}

/* Telas Gerais */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;
 padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.bg-souls{background:radial-gradient(circle at center, #1c1815 0%, #0a0908 100%);border: 2px solid var(--border)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.6)}
.btn{border:1px solid var(--gold);border-radius:4px;color:var(--gold);font-family:'Cinzel',serif;font-weight:700;background:#14110f;box-shadow:0 3px 6px rgba(0,0,0,.5);transition:all .15s}
.btn:active{transform:translateY(2px);background:#221b16}
.play{width:100%;padding:14px;font-size:1.2rem;background:linear-gradient(180deg,#2a1f18,#120e0c);color:var(--gold-glow);border:2px solid var(--gold);letter-spacing:1px;text-transform:uppercase;animation:pulseglow 3s infinite}
@keyframes pulseglow{0%,100%{box-shadow:0 0 8px rgba(197,168,128,.2)}50%{box-shadow:0 0 18px rgba(197,168,128,.5)}}

.logo{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#111;border:2px solid var(--gold);font-size:1.2rem;color:var(--gold);box-shadow:0 0 10px rgba(197,168,128,.3)}
h1{margin:2px 0 0;font-family:'Cinzel',serif;font-size:1.5rem;line-height:1;color:var(--gold-glow);text-shadow:0 2px 4px rgba(0,0,0,.9);letter-spacing:1px}
.sub{margin:4px 0 0;font-size:.75rem;color:var(--muted);font-style:italic}
.lbl{margin:0 0 4px;font-size:.75rem;font-family:'Cinzel',serif;color:var(--gold);font-weight:700;letter-spacing:.5px}
#fs-btn{position:fixed;z-index:60;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:36px;height:36px;border-radius:50%;border:1px solid var(--gold);background:#111;color:var(--gold);display:grid;place-items:center;font-size:.9rem}

/* Setup */
.setup,.result{display:flex;flex-direction:column;flex:1;min-height:0;gap:8px;justify-content:space-between;position:relative;z-index:1}
.hero{text-align:center;padding-top:2px}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:6px}
.opt{border:1px solid var(--border);background:#14110f;color:var(--muted);border-radius:4px;padding:4px 10px;font-size:.68rem;font-family:'Cinzel',serif;transition:all .15s}
.opt.on{background:#261f18;border-color:var(--gold);color:var(--gold-glow)}
.pick{flex:1;min-height:0;display:flex;flex-direction:column}
.themes-wrapper{flex:1;min-height:0;overflow-y:auto;padding-right:2px}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.tile{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border);text-align:left;color:var(--text);transition:all .15s;background:#14110f}
.tile:active{transform:scale(.97)}
.tile.sel{border-color:var(--gold);background:#221b16;box-shadow:inset 0 0 8px rgba(197,168,128,.2)}
.ico{flex:none;width:28px;height:28px;border-radius:4px;display:grid;place-items:center;color:var(--gold);background:#0a0908;border:1px solid var(--border);font-size:.8rem}
.tile b{display:block;font-size:.75rem;font-family:'Cinzel',serif;color:var(--gold-glow);line-height:1.1}
.tile small{font-size:.6rem;color:var(--muted)}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.time-btn{padding:6px 0;border:1px solid var(--border);border-radius:4px;background:#14110f;font-weight:700;font-size:.75rem;color:var(--muted);transition:all .1s}
.time-btn.sel{background:#261f18;color:var(--gold-glow);border-color:var(--gold)}

/* Contagem Regressiva */
#countdown-screen {
 position: fixed; inset: 0; z-index: 50;
 display: flex; flex-direction: column; align-items: center; justify-content: center;
 text-align: center; padding: 12px; overflow: hidden; background: rgba(5,5,5,0.95);
}
.countdown-content { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 400px; margin: auto; }
.countdown-title { font-family:'Cinzel',serif; font-weight: 700; font-size: clamp(1rem, 4vw, 1.4rem); color: var(--gold); margin: 0 0 10px 0; letter-spacing: 2px; }
#countdown-number { font-family:'Cinzel',serif; font-size: clamp(6rem, 30vh, 12rem); font-weight: 900; line-height: 1; color: var(--gold-glow); text-shadow: 0 0 20px rgba(197,168,128,.5); animation: pop .9s ease-out infinite; margin: 0; }
@keyframes pop { 0% { transform: scale(.5); opacity: 0; } 40% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
.hint { margin-top: 15px; padding: 8px 16px; border-radius: 4px; background: #14110f; border: 1px solid var(--border); font-size: clamp(0.7rem, 2.5vw, 0.8rem); color: var(--muted); max-width: 95%; }

/* Jogo */
#game-screen{z-index:40;display:grid;gap:8px;grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"bar bar" "word word" "skip ok";color:#fff}
.bar{grid-area:bar;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-right:42px}
.pill{background:#14110f;border:1px solid var(--border);color:var(--gold);border-radius:4px;padding:5px 14px;font-weight:700;display:flex;align-items:center;gap:6px;font-family:'Cinzel',serif;font-size:.85rem}
.pill.urgent{background:var(--dark-red);color:#ff9999;border-color:var(--crimson);animation:pulse .6s infinite}
.pill.bump{animation:bump .35s}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes bump{40%{transform:scale(1.25)}}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:#14110f;color:var(--muted)}
.wordbox{grid-area:word;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0;cursor:pointer}
.tag{background:#14110f;border:1px solid var(--border);color:var(--gold);padding:3px 14px;border-radius:4px;font-family:'Cinzel',serif;font-size:.7rem;margin-bottom:10px;letter-spacing:1px}
#word-display{margin:0;max-width:100%;font-family:'Cinzel',serif;font-size:clamp(2rem,9vw,3.8rem);line-height:1.1;font-weight:700;color:var(--gold-glow);text-shadow:0 4px 12px rgba(0,0,0,.9);overflow-wrap:anywhere}
#word-display.in-ok{animation:wOk .35s cubic-bezier(.3,1.6,.5,1)}
#word-display.in-skip{animation:wSkip .3s ease-out}
@keyframes wOk{0%{transform:translateY(-40px) scale(.7);opacity:0}100%{transform:none;opacity:1}}
@keyframes wSkip{0%{transform:translateY(40px);opacity:0}100%{transform:none;opacity:1}}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px;font-size:.9rem;font-family:'Cinzel',serif;letter-spacing:.5px}
.act i{font-size:1.2rem}
.skip{grid-area:skip;background:#1a100e;border-color:#5c221a;color:#d98273}
.ok{grid-area:ok;background:#0e1a14;border-color:#1c593c;color:#73d9a6}
.l-only{display:none}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .15s}
#fb{position:absolute;left:50%;top:42%;z-index:5;pointer-events:none;opacity:0;font-family:'Cinzel',serif;font-size:clamp(1.8rem,8vw,3rem);font-weight:700;white-space:nowrap;text-shadow:0 4px 10px rgba(0,0,0,.9)}
#fb.show{animation:fbpop .7s ease-out}
@keyframes fbpop{0%{opacity:0;transform:translate(-50%,0) scale(.5)}25%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
.part{position:fixed;z-index:6;pointer-events:none;animation:burst .75s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.3);opacity:0}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Resultado */
.result{grid-template-rows:auto minmax(0,1fr) auto}
.top{text-align:center;padding-top:2px;padding-right:38px}
.listbox{min-height:0;display:flex;flex-direction:column;flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stat{padding:6px;background:#14110f;border:1px solid var(--border)}.stat small{font-size:.65rem;color:var(--muted);font-family:'Cinzel',serif}
.stat b{display:block;font-size:1.8rem;line-height:1.1;font-family:'Cinzel',serif;color:var(--gold-glow)}
#word-history{flex:1;min-height:0;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:5px;background:#111}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-radius:4px;background:#171717;border:1px solid var(--border);font-size:.8rem;animation:rowin .3s both}
@keyframes rowin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.chip{flex:none;font-size:.65rem;font-family:'Cinzel',serif;font-weight:700;padding:2px 8px;border-radius:3px}
.chip.ok{background:#0e1a14;color:#73d9a6;border:1px solid #1c593c}
.chip.no{background:#1a100e;color:#d98273;border:1px solid #5c221a}
.confetti{position:fixed;top:-6vh;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg);opacity:0}}

@media (orientation:landscape) and (max-height:560px){
 .setup{display:grid;grid-template-columns:minmax(180px,32%) 1fr;grid-template-areas:"hero themes" "time themes" "play themes";grid-template-rows:auto auto 1fr;column-gap:8px}
 .hero{grid-area:hero;padding-top:0}.pick{grid-area:themes}.timebox{grid-area:time}.playbox{grid-area:play;align-self:end}
 .hero .logo{width:32px;height:32px;font-size:.9rem}
 h1{font-size:1.1rem}.sub{display:none}
 .themes{grid-template-columns:repeat(2,1fr);gap:4px}
 .tile{padding:3px 6px}.ico{width:22px;height:22px;font-size:.65rem}
 .play{padding:8px;font-size:1rem}
 #game-screen{grid-template-columns:clamp(96px,17vw,150px) 1fr clamp(96px,17vw,150px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"skip bar ok" "skip word ok"}
 #word-display{font-size:clamp(2rem,14vh,3.8rem)}
 .p-only{display:none}.l-only{display:inline}
 .result{display:grid;grid-template-columns:minmax(190px,36%) 1fr;grid-template-areas:"top list" "btn list";grid-template-rows:1fr auto;column-gap:10px}
 .top{grid-area:top}.listbox{grid-area:list}.btnbox{grid-area:btn}
 .top .logo{width:32px;height:32px;font-size:.8rem}
 .top h2{font-size:1rem!important}.top .sub{display:none}
 .stats{margin-top:4px}.stat b{font-size:1.2rem}
 #countdown-number { font-size: clamp(4rem, 22vh, 8rem); }
 .hint { font-size: 0.65rem; padding: 4px 8px; margin-top: 4px; }
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body onclick="tryStartBGM()">
<button id="fs-btn" onclick="event.stopPropagation();toggleFullScreen()" aria-label="Tela cheia"><i id="fs-icon" class="fa-solid fa-expand"></i></button>

<!-- 1. MENU -->
<div id="setup-screen" class="screen bg-souls">
 <div class="setup">
  <div class="hero">
   <div class="logo"><i class="fa-solid fa-skull"></i></div>
   <h1>Souls Guess</h1>
   <p class="sub">O celular na testa, o mundo em cinzas...</p>
   <div class="opts">
    <button id="opt-sound" class="opt" onclick="event.stopPropagation();toggleOpt('sound')"><i class="fa-solid fa-volume-high"></i> Efeitos</button>
    <button id="opt-music" class="opt" onclick="event.stopPropagation();toggleOpt('music')"><i class="fa-solid fa-music"></i> Trilha</button>
    <button id="opt-tilt" class="opt" onclick="event.stopPropagation();toggleOpt('tilt')"><i class="fa-solid fa-mobile-screen"></i> Giroscópio</button>
    <button id="opt-touch" class="opt" onclick="event.stopPropagation();toggleOpt('touch')"><i class="fa-solid fa-hand-pointer"></i> Toque</button>
   </div>
  </div>
  <div class="pick">
   <p class="lbl"><i class="fa-solid fa-fire"></i> Escolha o Domínio</p>
   <div class="themes-wrapper"><div id="themes-container" class="themes"></div></div>
  </div>
  <div class="timebox">
   <p class="lbl"><i class="fa-solid fa-hourglass-half"></i> Tempo de Provação</p>
   <div class="times">
    <button class="time-btn" data-time="30" onclick="event.stopPropagation();setTime(30)">30s</button>
    <button class="time-btn" data-time="60" onclick="event.stopPropagation();setTime(60)">1 min</button>
    <button class="time-btn" data-time="90" onclick="event.stopPropagation();setTime(90)">1m30</button>
    <button class="time-btn" data-time="120" onclick="event.stopPropagation();setTime(120)">2 min</button>
   </div>
  </div>
  <div class="playbox"><button class="btn play" onclick="event.stopPropagation();startCountdown()"><i class="fa-solid fa-fire"></i> Acender Fogueira</button></div>
 </div>
</div>

<!-- 2. CONTAGEM -->
<div id="countdown-screen" class="screen bg-souls hidden">
 <div class="countdown-content">
  <p class="countdown-title">Prepare-se para morrer...</p>
  <div id="countdown-number">3</div>
  <div class="hint" id="hint"></div>
 </div>
</div>

<!-- 3. JOGO -->
<div id="game-screen" class="screen bg-souls hidden">
 <div id="flash"></div>
 <div id="fb"></div>
 <div class="bar">
  <div id="timer-box" class="pill"><i class="fa-solid fa-hourglass"></i><span id="timer-display">60</span>s</div>
  <div id="score-box" class="pill"><i class="fa-solid fa-skull" style="color:var(--gold)"></i><span id="live-score">0</span></div>
  <button class="x" onclick="endGame()" aria-label="Desistir"><i class="fa-solid fa-xmark"></i></button>
 </div>
 <div class="wordbox" onclick="handleCorrectClick()">
  <span id="current-theme-label" class="tag">Domínio</span>
  <h2 id="word-display">...</h2>
 </div>
 <button class="btn act skip" onclick="event.stopPropagation();handleSkip()">
  <i class="fa-solid fa-arrow-up p-only"></i><i class="fa-solid fa-arrow-left l-only"></i>Recuar (Pular)
 </button>
 <button class="btn act ok" onclick="event.stopPropagation();handleCorrect()">
  <i class="fa-solid fa-arrow-down p-only"></i><i class="fa-solid fa-arrow-right l-only"></i>Vencer (Acertou)
 </button>
</div>

<!-- 4. RESULTADO -->
<div id="result-screen" class="screen bg-souls hidden">
 <div class="result">
  <div class="top">
   <div class="logo"><i class="fa-solid fa-fire"></i></div>
   <h2 id="res-title" style="margin:2px 0 0;font-size:1.4rem;font-family:'Cinzel',serif;color:var(--gold-glow)">Vítima do Destino</h2>
   <p class="sub" id="res-sub">Sua jornada ecoa nas cinzas...</p>
   <div class="stats">
    <div class="card stat"><small>Desafios Vencidos</small><b id="res-correct" style="color:#73d9a6">0</b></div>
    <div class="card stat"><small>Recuos</small><b id="res-skipped" style="color:#d98273">0</b></div>
   </div>
  </div>
  <div class="listbox">
   <p class="lbl"><i class="fa-solid fa-scroll"></i> Relato das Almas</p>
   <div id="word-history" class="card"></div>
  </div>
  <div class="btnbox"><button class="btn play" onclick="returnToMenu()"><i class="fa-solid fa-rotate-right"></i> Retornar à Fogueira</button></div>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);

let soundOn=true,musicOn=true,tiltOn=true,touchOn=true,tiltActive=false,tiltListening=false,tiltArmed=false;
const tiltSupported='DeviceOrientationEvent' in window;

function refreshOpts(){
 $('opt-sound').classList.toggle('on',soundOn);
 $('opt-sound').innerHTML=`<i class="fa-solid ${soundOn?'fa-volume-high':'fa-volume-xmark'}"></i> Efeitos`;
 
 $('opt-music').classList.toggle('on',musicOn);
 $('opt-music').innerHTML=`<i class="fa-solid ${musicOn?'fa-music':'fa-volume-xmark'}"></i> Trilha`;

 $('opt-tilt').classList.toggle('on',tiltOn&&tiltSupported);
 $('opt-touch').classList.toggle('on',touchOn);
}

function toggleOpt(k){
 if(k==='sound'){ soundOn=!soundOn; }
 else if(k==='music'){
  musicOn=!musicOn;
  if(!musicOn) stopBGM();
  else tryStartBGM();
 }
 else if(k==='tilt'){ tiltOn=!tiltOn; }
 else if(k==='touch'){ touchOn=!touchOn; }
 try{
  localStorage.setItem('souls_sound',soundOn?'1':'0');
  localStorage.setItem('souls_music',musicOn?'1':'0');
  localStorage.setItem('souls_tilt',tiltOn?'1':'0');
  localStorage.setItem('souls_touch',touchOn?'1':'0');
 }catch(e){}
 refreshOpts();
 playSound('click');
}

let audioCtx=null;
function initAudio(){
 try{
  if(!audioCtx){
   const AudioContextClass=window.AudioContext||window.webkitAudioContext;
   audioCtx=new AudioContextClass();
  }
  if(audioCtx.state==='suspended'){ audioCtx.resume(); }
 }catch(e){}
}

/* ==========================================
   TRILHAS ÉPICAS / SOMBRIAS (ESTILO SOULS)
   ========================================== */
let bgmTimer=null;
let currentBgmTrack=0;

const NOTES = {
 C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196.00, A3:220.00, B3:246.94,
 C4:261.63, CS4:277.18, D4:293.66, DS4:311.13, E4:329.63, F4:349.23, FS4:369.99,
 G4:392.00, GS4:415.30, A4:440.00, AS4:466.16, B4:493.88, C5:523.25, REST:0
};

const SOULS_TRACKS = [
 // 0: Menu Fogueira (Sombria, solene e misteriosa - inspirada em Firelink / Hub)
 {
  tempo: 650,
  notes: [
   [NOTES.A3, 1.2], [NOTES.E4, 1.2], [NOTES.C4, 1.2], [NOTES.B3, 1.8],
   [NOTES.A3, 1.2], [NOTES.F3, 1.2], [NOTES.E3, 1.2], [NOTES.REST, 1.0],
   [NOTES.G3, 1.2], [NOTES.D4, 1.2], [NOTES.B3, 1.2], [NOTES.A3, 1.8],
   [NOTES.F3, 1.2], [NOTES.E3, 1.2], [NOTES.D3, 1.2], [NOTES.REST, 1.0]
  ]
 },
 // 1: Batalha Épica A (Tensa e grandiosa - Estilo Boss Theme / Gwyn / Erdtree)
 {
  tempo: 320,
  notes: [
   [NOTES.A4, 0.4], [NOTES.E4, 0.4], [NOTES.F4, 0.4], [NOTES.E4, 0.4],
   [NOTES.D4, 0.4], [NOTES.C4, 0.4], [NOTES.B3, 0.8], [NOTES.A3, 0.8],
   [NOTES.D4, 0.4], [NOTES.F4, 0.4], [NOTES.A4, 0.4], [NOTES.G4, 0.4],
   [NOTES.F4, 0.8], [NOTES.E4, 0.8], [NOTES.REST, 0.4]
  ]
 },
 // 2: Batalha Épica B (Sombria e marcante - Estilo Bloodborne / Dark Souls 3)
 {
  tempo: 380,
  notes: [
   [NOTES.E4, 0.6], [NOTES.GS4, 0.6], [NOTES.B4, 0.6], [NOTES.C5, 0.6],
   [NOTES.B4, 0.6], [NOTES.GS4, 0.6], [NOTES.E4, 1.2],
   [NOTES.A4, 0.6], [NOTES.C5, 0.6], [NOTES.E5, 0.6], [NOTES.DS5, 0.6],
   [NOTES.C5, 0.6], [NOTES.B4, 0.6], [NOTES.A4, 1.2], [NOTES.REST, 0.6]
  ]
 }
];

function playBgmNote(freq, duration, volume=0.015){
 if(!musicOn||!audioCtx)return;
 try{
  if(audioCtx.state==='suspended')audioCtx.resume();
  if(freq===0)return;
  const t0=audioCtx.currentTime;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='triangle'; // Timbre mais encorpado, lembrando alaúde/órgão sutil
  o.frequency.setValueAtTime(freq,t0);
  
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(volume, t0 + 0.1);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);

  o.connect(g);g.connect(audioCtx.destination);
  o.start(t0);o.stop(t0+duration+.05);
 }catch(e){}
}

function startBGM(trackIndex=0){
 stopBGM();
 if(!musicOn)return;
 initAudio();
 currentBgmTrack=trackIndex;
 let noteIndex=0;
 const track=SOULS_TRACKS[currentBgmTrack];

 bgmTimer=setInterval(()=>{
  if(!musicOn||!isPlayingMenuOrGame())return;
  const currentNote=track.notes[noteIndex];
  playBgmNote(currentNote[0], currentNote[1]*0.9, 0.014);
  noteIndex=(noteIndex+1)%track.notes.length;
 },track.tempo);
}

function stopBGM(){
 if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;}
}

function isPlayingMenuOrGame(){
 return !$('setup-screen').classList.contains('hidden') || isPlaying;
}

const SOUNDS={
 correct:[[523,0,.15,'triangle',.25],[659,.12,.2,'triangle',.25],[784,.24,.3,'triangle',.3]],
 skip:[[180,0,.15,'sawtooth',.15,120],[130,.12,.2,'sawtooth',.12,90]],
 combo:[[659,0,.1,'triangle',.3],[830,.1,.1,'triangle',.3],[987,.2,.15,'triangle',.3],[1318,.3,.35,'triangle',.35]],
 beep:[[440,0,.1,'sine',.2]],

 tick:[[500,0,.05,'square',.08]],
 tick3:[[800,0,.09,'square',.12]],
 click:[[300,0,.08,'sine',.15,450]],
 armed:[[440,0,.08,'triangle',.15],[660,.08,.12,'triangle',.15]],
 buzz:[[110,0,.5,'sawtooth',.2,70]],
 win:[[440,0,.2,'triangle',.3],[554,.2,.2,'triangle',.3],[659,.4,.2,'triangle',.3],[880,.6,.5,'triangle',.35]],
 lose:[[220,0,.3,'sawtooth',.25],[185,.3,.3,'sawtooth',.25],[146,.6,.6,'sawtooth',.25]]
};

function playSound(type){
 if(!soundOn)return;
 try{
  initAudio();
  if(!audioCtx)return;
  const seq=SOUNDS[type];if(!seq)return;
  const t0=audioCtx.currentTime;
  seq.forEach(([f,s,d,w,v,f2])=>{
   const o=audioCtx.createOscillator(),g=audioCtx.createGain();
   o.type=w;o.connect(g);g.connect(audioCtx.destination);
   o.frequency.setValueAtTime(f,t0+s);
   if(f2)o.frequency.linearRampToValueAtTime(f2,t0+s+d);
   g.gain.setValueAtTime(v,t0+s);
   g.gain.exponentialRampToValueAtTime(.001,t0+s+d);
   o.start(t0+s);o.stop(t0+s+d+.02);
  });
 }catch(e){}
}

function toggleFullScreen(){
 const el=document.documentElement;
 if(!document.fullscreenElement&&!document.webkitFullscreenElement){
  const r=el.requestFullscreen||el.webkitRequestFullscreen;
  if(r){const p=r.call(el);if(p&&p.catch)p.catch(()=>{})}
 }else{const x=document.exitFullscreen||document.webkitExitFullscreen;if(x)x.call(document)}
}

async function enableTilt(){
 if(!tiltSupported||!tiltOn)return false;
 try{
  if(typeof DeviceOrientationEvent.requestPermission==='function'){
   const r=await DeviceOrientationEvent.requestPermission();
   if(r!=='granted')return false;
  }
  if(!tiltListening){window.addEventListener('deviceorientation',onTilt);tiltListening=true}
  return true;
 }catch(e){return false}
}
function onTilt(e){
 if(e.beta==null||e.gamma==null)return;
 if(!isPlaying||!tiltActive)return;
 const b=e.beta*Math.PI/180,g=e.gamma*Math.PI/180;
 const z=Math.cos(g)*Math.cos(b);
 if(!tiltArmed){
  if(Math.abs(z)<0.3){tiltArmed=true;playSound('armed')}
  return;
 }
 if(z<-0.55){tiltArmed=false;handleCorrect()}
 else if(z>0.55){tiltArmed=false;handleSkip()}
}

function shuffleArray(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}

async function startCountdown(){
 if(isCounting||isPlaying)return;
 isCounting=true;
 
 initAudio();
 stopBGM();
 playSound('click');

 tiltActive=false;tiltArmed=false;
 const hint=$('hint');
 
 let infoText='';
 if(tiltOn&&touchOn)infoText='<i class="fa-solid fa-mobile-screen"></i> Giroscópio (inclinar) ou Swipe ↓/↑ ativos';
 else if(tiltOn)infoText='<i class="fa-solid fa-mobile-screen"></i> Incline para baixo (vencer) ou cima (recuar)';
 else if(touchOn)infoText='<i class="fa-solid fa-hand-pointer"></i> Deslize ou toque para vencer / recuar';
 else infoText='<i class="fa-solid fa-triangle-exclamation"></i> Nenhum controle ativado! Use os botões da tela.';
 
 hint.innerHTML=infoText;

 if(tiltOn){
  const ok=await enableTilt();
  tiltActive=ok;
  if(!ok&&tiltOn){
   hint.innerHTML+='<br><small style="color:#d9534f">Giroscópio indisponível. Usando apenas botões/toque.</small>';
  }
 }

 currentWords=shuffleArray(themes[selectedTheme].words);
 currentIndex=0;scoreCorrect=0;scoreSkipped=0;streak=0;wordHistoryList=[];lastShownWord=null;
 document.body.classList.add('in-game');
 $('setup-screen').classList.add('hidden');
 const cs=$('countdown-screen');cs.classList.remove('hidden');
 let count=3;const num=$('countdown-number');num.innerText=count;playSound('beep');vibrate(30);
 const step=()=>{
  count--;
  if(count>0){num.innerText=count;playSound('beep');vibrate(30)}
  else if(count===0){num.innerText='LUTE!';playSound('start');vibrate([60,40,60])}
  else{cs.classList.add('hidden');isCounting=false;startGame();return}
  countdownTimeout=setTimeout(step,1000);
 };
 countdownTimeout=setTimeout(step,1000);
}

function startGame(){
 isPlaying=true;lastAction=0;tiltArmed=false;requestWakeLock();
 const gs=$('game-screen');gs.classList.remove('hidden');
 $('current-theme-label').innerText=themes[selectedTheme].name;
 $('live-score').innerText='0';$('timer-box').classList.remove('urgent');
 timeLeft=gameTime;$('timer-display').innerText=timeLeft;
 showNextWord('ok');

 const randomGameTrack = Math.random() < 0.5 ? 1 : 2;
 startBGM(randomGameTrack);

 endTime=Date.now()+gameTime*1000;
 timerInterval=setInterval(()=>{
  const r=Math.max(0,Math.ceil((endTime-Date.now())/1000));
  if(r!==timeLeft){
   timeLeft=r;$('timer-display').innerText=r;
   if(r<=10&&r>0){$('timer-box').classList.add('urgent');playSound(r<=3?'tick3':'tick')}
  }
  if(r<=0)endGame(true);
 },200);
}
function showNextWord(kind){

  currentWords=shuffleArray(themes[selectedTheme].words);currentIndex=0;
  if(currentWords.length>1&&currentWords[0]===lastShownWord)[currentWords[0],currentWords[1]]=[currentWords[1],currentWords[0]];
 }
 lastShownWord=currentWords[currentIndex];
 const el=$('word-display');el.textContent=lastShownWord;
 el.classList.remove('in-ok','in-skip');void el.offsetWidth;el.classList.add(kind==='skip'?'in-skip':'in-ok');
}

}

function burst(emojis){

  const p=document.createElement('span');p.className='part';p.textContent=emojis[i%emojis.length];
  const a=Math.random()*Math.PI*2,d=80+Math.random()*120;
  p.style.left='50%';p.style.top='45%';p.style.fontSize=(16+Math.random()*14)+'px';
  p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+'px');
  document.body.appendChild(p);setTimeout(()=>p.remove(),800);
 }

}

let tY=0,tX=0;

},{passive:true});

},{passive:true});

function countUp(el,to){
 el.innerText='0';if(!to)return;

function endGame(timeUp){
 if(!isPlaying)return;

  const p=document.createElement('p');p.style.cssText='text-align:center;font-size:.85rem;color:var(--muted)';
  p.textContent='Nenhum desafio enfrentado.';box.appendChild(p);
 }else{
  wordHistoryList.forEach((it,i)=>{
   const ok=it.status==='correct';
   const row=document.createElement('div');row.className='row';row.style.animationDelay=Math.min(i*40,800)+'ms';
   const w=document.createElement('span');w.textContent=it.word;
   const c=document.createElement('span');c.className='chip '+(ok?'ok':'no');c.textContent=ok?'Venceu':'Recuou';
   row.append(w,c);box.appendChild(row);
  });
 }
 if(timeUp)playSound('buzz');
 setTimeout(()=>playSound(scoreCorrect>0?'win':'lose'),timeUp?500:0);

}
