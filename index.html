<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1714">
<title>Souls Guess PT-BR</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1714;--parchment:#d4af37;--gold:#c5a059;--darkbg:#0d0b0a;--fire:#ff6b21;--blood:#8a1c1c;--gray:#8c8275}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Cinzel',serif;color:var(--parchment);background:var(--darkbg);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.hidden{display:none!important}
button{font:inherit;cursor:pointer}

/* Telas Gerais */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;
 padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.bg-souls{background:radial-gradient(circle at center, #26201b 0%, #0d0b0a 100%);border: 2px solid rgba(197, 160, 89, 0.25);}
.card{background:rgba(20, 17, 15, 0.95);border:1px solid rgba(197,160,89,0.35);border-radius:6px;box-shadow:0 4px 15px rgba(0,0,0,.7)}
.btn{border:1px solid var(--gold);border-radius:4px;color:var(--parchment);font-weight:700;background:#14110f;box-shadow:0 4px 6px rgba(0,0,0,.5);transition:transform .08s,box-shadow .08s, background .2s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 2px rgba(0,0,0,.5);background:#221d19}
.play{width:100%;padding:12px;font-size:1.1rem;background:linear-gradient(135deg,#3d100c,#14110f);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;gap:10px;animation:breathe 3s ease-in-out infinite;text-transform:uppercase;letter-spacing:1px}
@keyframes breathe{50%{border-color:var(--fire);box-shadow:0 0 15px rgba(255,107,33,0.3)}}
.logo{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#14110f;border:1px solid var(--gold);font-size:1.3rem;color:var(--fire);box-shadow:0 0 10px rgba(197,160,89,0.3);animation:wig 4s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.05)}}
h1{margin:2px 0 0;font-size:1.4rem;line-height:1;color:var(--parchment);text-shadow:0 2px 4px rgba(0,0,0,.9);letter-spacing:1px}
.sub{margin:4px 0 0;font-size:.7rem;color:var(--gray);font-weight:500;text-transform:uppercase;letter-spacing:1px}
.lbl{margin:0 0 4px;font-size:.7rem;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px}
#fs-btn{position:fixed;z-index:60;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:36px;height:36px;border-radius:50%;border:1px solid var(--gold);background:#14110f;color:var(--parchment);box-shadow:0 3px 6px rgba(0,0,0,.5);display:grid;place-items:center;font-size:.85rem}
.bub{position:absolute;bottom:-12%;z-index:0;pointer-events:none;opacity:.25;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) rotate(360deg)}}

/* Setup */
.setup,.result{display:flex;flex-direction:column;flex:1;min-height:0;gap:6px;justify-content:space-between;position:relative;z-index:1}
.hero{text-align:center;padding-top:2px}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:5px}
.opt{border:1px solid rgba(197,160,89,0.3);background:rgba(20,17,15,0.7);color:var(--gray);border-radius:4px;padding:3px 9px;font-size:.65rem;font-weight:600;transition:all .15s;text-transform:uppercase}
.opt.on{background:#1f1915;border-color:var(--gold);color:var(--parchment);box-shadow:0 0 6px rgba(197,160,89,0.2)}
.pick{flex:1;min-height:0;display:flex;flex-direction:column}
.themes-wrapper{flex:1;min-height:0;overflow-y:auto;padding-right:2px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.tile{display:flex;align-items:center;gap:6px;padding:6px 7px;border:1px solid rgba(197,160,89,0.2);text-align:left;color:var(--parchment);transition:transform .1s}
.tile:active{transform:scale(.96)}
.tile.sel{border-color:var(--fire);background:#251812;box-shadow:0 0 10px rgba(255,107,33,0.25);animation:selpop .3s}
@keyframes selpop{50%{transform:scale(1.04)}}
.ico{flex:none;width:24px;height:24px;border-radius:4px;display:grid;place-items:center;color:var(--parchment);font-size:.7rem;border:1px solid rgba(197,160,89,0.3)}
.tile b{display:block;font-size:.68rem;font-weight:700;line-height:1.1}
.tile small{font-size:.55rem;opacity:.6}
.tile div:last-child{min-width:0}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.time-btn{padding:5px 0;border:1px solid rgba(197,160,89,0.3);border-radius:4px;background:#14110f;font-weight:700;font-size:.7rem;color:var(--gray);box-shadow:0 2px 4px rgba(0,0,0,.4);transition:all .1s}
.time-btn.sel{background:#3d100c;color:var(--parchment);border-color:var(--fire);transform:translateY(-1px);box-shadow:0 0 8px rgba(255,107,33,0.3)}

/* Contagem Regressiva */
#countdown-screen {
 position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
 align-items: center; justify-content: center; text-align: center; padding: 12px; overflow: hidden;
}
.countdown-content { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 400px; margin: auto; }
.countdown-title { font-weight: 700; font-size: clamp(0.9rem, 3.5vw, 1.2rem); color: var(--gold); margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: 2px; }
#countdown-number { font-family: 'IM Fell English SC', serif; font-size: clamp(5rem, 25vh, 12rem); font-weight: 700; line-height: 1; color: var(--parchment); text-shadow: 0 0 20px rgba(255,107,33,0.5); animation: pop .9s ease-out infinite; margin: 0; }
@keyframes pop { 0% { transform: scale(.5); opacity: .3; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
.hint { margin-top: 15px; padding: 6px 14px; border-radius: 4px; background: rgba(20,17,15,0.9); border: 1px solid var(--gold); font-size: clamp(0.65rem, 2.2vw, 0.8rem); font-weight: 500; max-width: 95%; box-shadow: 0 4px 10px rgba(0,0,0,.8); color: var(--gray); }

/* Jogo */
#game-screen{z-index:40;display:grid;gap:8px;grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"bar bar" "word word" "skip ok";color:var(--parchment)}
.bar{grid-area:bar;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-right:42px}
.pill{background:rgba(20,17,15,0.9);border:1px solid var(--gold);color:var(--parchment);border-radius:4px;padding:4px 12px;font-weight:700;display:flex;align-items:center;gap:6px;font-size:.8rem}
.pill.urgent{background:#3d100c;border-color:var(--blood);color:#ff9999;animation:pulse .6s infinite}
.pill.bump{animation:bump .35s}
@keyframes pulse{50%{transform:scale(1.05)}}
@keyframes bump{40%{transform:scale(1.25)}}
.x{width:34px;height:34px;border-radius:4px;border:1px solid var(--gold);background:rgba(20,17,15,0.9);color:var(--parchment)}
.wordbox{grid-area:word;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0;cursor:pointer;padding: 0 10px;}
.tag{background:rgba(20,17,15,0.85);border:1px solid rgba(197,160,89,0.4);color:var(--gold);padding:3px 12px;border-radius:4px;font-weight:700;font-size:.7rem;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
#word-display{margin:0;max-width:100%;font-family:'IM Fell English SC', serif;font-size:clamp(2rem,9vw,3.8rem);line-height:1.1;font-weight:700;text-shadow:0 0 15px rgba(0,0,0,.9);overflow-wrap:anywhere;color:var(--parchment)}
#word-display.in-ok{animation:wOk .35s cubic-bezier(.3,1.6,.5,1)}
#word-display.in-skip{animation:wSkip .3s ease-out}
@keyframes wOk{0%{transform:translateY(-30px) scale(.7);opacity:0}100%{transform:none;opacity:1}}
@keyframes wSkip{0%{transform:translateY(30px);opacity:0}100%{transform:none;opacity:1}}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px;font-size:.8rem;text-transform:uppercase;letter-spacing:1px}
.act i{font-size:1.2rem}
.skip{grid-area:skip;background:#1e1412;border-color:#5c221a;color:#d98273}.ok{grid-area:ok;background:#122119;border-color:#1e5c3a;color:#80d9a7}
.l-only{display:none}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .15s}
#fb{position:absolute;left:50%;top:42%;z-index:5;pointer-events:none;opacity:0;font-size:clamp(1.5rem,7vw,2.8rem);font-weight:700;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.9);font-family:'IM Fell English SC',serif;}
#fb.show{animation:fbpop .7s ease-out}
@keyframes fbpop{0%{opacity:0;transform:translate(-50%,0) scale(.5)}30%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50px) scale(1)}}
.part{position:fixed;z-index:6;pointer-events:none;animation:burst .75s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(180deg) scale(.3);opacity:0}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Resultado */
.result{grid-template-rows:auto minmax(0,1fr) auto}
.top{text-align:center;padding-top:2px;padding-right:38px}
.listbox{min-height:0;display:flex;flex-direction:column;flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.stat{padding:6px}.stat small{font-size:.6rem;font-weight:600;color:var(--gray);text-transform:uppercase}
.stat b{display:block;font-size:1.7rem;line-height:1.1;font-family:'IM Fell English SC',serif;}
#word-history{flex:1;min-height:0;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 8px;border-radius:4px;background:#14110f;border:1px solid rgba(197,160,89,0.15);font-size:.75rem;font-weight:500;animation:rowin .3s both}
@keyframes rowin{from{opacity:0;transform:translateX(-10px)}}
.chip{flex:none;font-size:.6rem;font-weight:700;padding:2px 6px;border-radius:3px;color:#fff}
.chip.ok{background:#1e5c3a;color:#80d9a7}.chip.no{background:#5c221a;color:#d98273}
.confetti{position:fixed;top:-6vh;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}

/* Ajustes Paisagem */
@media (orientation:landscape) and (max-height:560px){
 .setup{display:grid;grid-template-columns:minmax(180px,32%) 1fr;grid-template-areas:"hero themes" "time themes" "play themes";grid-template-rows:auto auto 1fr;column-gap:8px}
 .hero{grid-area:hero;padding-top:0}.pick{grid-area:themes}.timebox{grid-area:time}.playbox{grid-area:play;align-self:end}
 .hero .logo{width:30px;height:30px;font-size:.85rem}
 h1{font-size:1.1rem}.sub{display:none}
 .themes{grid-template-columns:repeat(2,1fr);gap:4px}
 .tile{padding:3px 5px}.ico{width:20px;height:20px;font-size:.6rem}
 .play{padding:6px;font-size:.85rem}
 #game-screen{grid-template-columns:clamp(96px,17vw,150px) 1fr clamp(96px,17vw,150px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"skip bar ok" "skip word ok"}
 #word-display{font-size:clamp(1.8rem,14vh,3.5rem)}
 .p-only{display:none}.l-only{display:inline}
 .result{display:grid;grid-template-columns:minmax(190px,36%) 1fr;grid-template-areas:"top list" "btn list";grid-template-rows:1fr auto;column-gap:10px}
 .top{grid-area:top}.listbox{grid-area:list}.btnbox{grid-area:btn}
 .top .logo{width:30px;height:30px;font-size:.8rem}
 .top h2{font-size:1rem!important}.top .sub{display:none}
 .stats{margin-top:4px}.stat b{font-size:1.1rem}
 #countdown-number { font-size: clamp(3.5rem, 20vh, 8rem); }
 .hint { font-size: 0.65rem; padding: 3px 8px; margin-top: 4px; }
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<button id="fs-btn" onclick="toggleFullScreen()" aria-label="Tela cheia"><i id="fs-icon" class="fa-solid fa-expand"></i></button>

<!-- 1. MENU -->
<div id="setup-screen" class="screen bg-souls">
 <div class="setup">
  <div class="hero">
   <div class="logo"><i class="fa-solid fa-fire"></i></div>
   <h1>Souls Guess PT-BR</h1>
   <p class="sub">Celular na testa, honre os reinos caídos!</p>
   <div class="opts">
    <button id="opt-sound" class="opt" onclick="toggleOpt('sound')"><i class="fa-solid fa-volume-high"></i> Sons</button>
    <button id="opt-tilt" class="opt" onclick="toggleOpt('tilt')"><i class="fa-solid fa-mobile-screen"></i> Giroscópio</button>
    <button id="opt-touch" class="opt" onclick="toggleOpt('touch')"><i class="fa-solid fa-hand-pointer"></i> Toque</button>
   </div>
  </div>
  <div class="pick">
   <p class="lbl"><i class="fa-solid fa-skull"></i> Escolha o Reino / Jogo</p>
   <div class="themes-wrapper"><div id="themes-container" class="themes"></div></div>
  </div>
  <div class="timebox">
   <p class="lbl"><i class="fa-solid fa-hourglass-half"></i> Tempo de Vigília</p>
   <div class="times">
    <button class="time-btn" data-time="30" onclick="setTime(30)">30s</button>
    <button class="time-btn" data-time="60" onclick="setTime(60)">1 min</button>
    <button class="time-btn" data-time="90" onclick="setTime(90)">1m30</button>
    <button class="time-btn" data-time="120" onclick="setTime(120)">2 min</button>
   </div>
  </div>
  <div class="playbox"><button class="btn play" onclick="startCountdown()"><i class="fa-solid fa-fire-flame-curved"></i> Acender Fogueira</button></div>
 </div>
</div>

<!-- 2. CONTAGEM -->
<div id="countdown-screen" class="screen bg-souls hidden">
 <div class="countdown-content">
  <p class="countdown-title">Prepare o celular na testa...</p>
  <div id="countdown-number">3</div>
  <div class="hint" id="hint"></div>
 </div>
</div>

<!-- 3. JOGO -->
<div id="game-screen" class="screen bg-souls hidden">
 <div id="flash"></div>
 <div id="fb"></div>
 <div class="bar">
  <div id="timer-box" class="pill"><i class="fa-solid fa-hourglass"></i><span id="timer-display">60</span>s</div>
  <div id="score-box" class="pill"><i class="fa-solid fa-fire" style="color:var(--fire)"></i><span id="live-score">0</span></div>
  <button class="x" onclick="endGame()" aria-label="Desistir"><i class="fa-solid fa-xmark"></i></button>
 </div>
 <div class="wordbox card" onclick="handleCorrectClick()">
  <span id="current-theme-label" class="tag">Reino</span>
  <h2 id="word-display">...</h2>
 </div>
 <button class="btn act skip" onclick="event.stopPropagation();handleSkip()">
  <i class="fa-solid fa-arrow-up p-only"></i><i class="fa-solid fa-arrow-left l-only"></i>Desprezar (Pular)
 </button>
 <button class="btn act ok" onclick="event.stopPropagation();handleCorrect()">
  <i class="fa-solid fa-arrow-down p-only"></i><i class="fa-solid fa-arrow-right l-only"></i>Louvado Seja! (Acertou)
 </button>
</div>

<!-- 4. RESULTADO -->
<div id="result-screen" class="screen bg-souls hidden">
 <div class="result">
  <div class="top">
   <div class="logo"><i class="fa-solid fa-skull"></i></div>
   <h2 id="res-title" style="margin:2px 0 0;font-size:1.3rem;color:var(--parchment);text-shadow:0 2px 4px rgba(0,0,0,.9)">Fim da Jornada</h2>
   <p class="sub" id="res-sub">Sua alma perdurará...</p>
   <div class="stats">
    <div class="card stat"><small>Almas Coletadas</small><b id="res-correct" style="color:#80d9a7">0</b></div>
    <div class="card stat"><small>Perdidas</small><b id="res-skipped" style="color:#d98273">0</b></div>
   </div>
  </div>
  <div class="listbox">
   <p class="lbl"><i class="fa-solid fa-scroll"></i> Registro de Destinos</p>
   <div id="word-history" class="card"></div>
  </div>
  <div class="btnbox"><button class="btn play" onclick="returnToMenu()"><i class="fa-solid fa-rotate-right"></i> Retornar ao Nexus</button></div>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);

let soundOn=true,tiltOn=true,touchOn=true,tiltActive=false,tiltListening=false,tiltArmed=false;
const tiltSupported='DeviceOrientationEvent' in window;

function refreshOpts(){
 $('opt-sound').classList.toggle('on',soundOn);
 $('opt-sound').innerHTML=`<i class="fa-solid ${soundOn?'fa-volume-high':'fa-volume-xmark'}"></i> Sons`;
 $('opt-tilt').classList.toggle('on',tiltOn&&tiltSupported);
 $('opt-touch').classList.toggle('on',touchOn);
}

function toggleOpt(k){
 if(k==='sound')soundOn=!soundOn;
 else if(k==='tilt')tiltOn=!tiltOn;
 else if(k==='touch')touchOn=!touchOn;
 try{
  localStorage.setItem('souls_sound',soundOn?'1':'0');
  localStorage.setItem('souls_tilt',tiltOn?'1':'0');
  localStorage.setItem('souls_touch',touchOn?'1':'0');
 }catch(e){}
 refreshOpts();
 playSound('click');
}

let audioCtx=null;
function initAudio(){
 try{
  if(!audioCtx){
   const AudioContextClass=window.AudioContext||window.webkitAudioContext;
   audioCtx=new AudioContextClass();
  }
  if(audioCtx.state==='suspended'){
   audioCtx.resume();
  }
  const dummy=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  gain.gain.value=0.001;
  dummy.connect(gain);
  gain.connect(audioCtx.destination);
  dummy.start();
  dummy.stop(audioCtx.currentTime+0.01);
 }catch(e){}
}

const SOUNDS={
 correct:[[440,0,.1,'triangle',.25],[659,.08,.2,'triangle',.25]],
 skip:[[180,0,.15,'sawtooth',.12,120],[130,.12,.2,'sawtooth',.1,90]],
 combo:[[440,0,.1,'triangle',.25],[554,.08,.1,'triangle',.25],[659,.16,.1,'triangle',.25],[880,.24,.3,'triangle',.25]],
 beep:[[350,0,.12,'sine',.15]],
 start:[[220,0,.15,'sawtooth',.2],[440,0.15,.35,'sawtooth',.25]],
 tick:[[300,0,.05,'square',.06]],
 tick3:[[500,0,.1,'square',.1]],
 click:[[280,0,.08,'sine',.12,400]],
 armed:[[550,0,.06,'sine',.12],[825,0.07,.1,'sine',.12]],
 buzz:[[110,0,.5,'sawtooth',.15,70]],
 win:[[440,0,.15,'triangle',.2],[554,0.15,.15,'triangle',.2],[659,0.3,.15,'triangle',.2],[880,0.45,.4,'triangle',.25]],
 lose:[[220,0,.3,'sine',.2],[185,0.3,.3,'sine',.2],[146,0.6,.5,'sine',.2]]
};

function playSound(type){
 if(!soundOn)return;
 try{
  initAudio();
  if(!audioCtx)return;
  const seq=SOUNDS[type];if(!seq)return;
  const t0=audioCtx.currentTime;
  seq.forEach(([f,s,d,w,v,f2])=>{
   const o=audioCtx.createOscillator(),g=audioCtx.createGain();
   o.type=w;o.connect(g);g.connect(audioCtx.destination);
   o.frequency.setValueAtTime(f,t0+s);
   if(f2)o.frequency.linearRampToValueAtTime(f2,t0+s+d);
   g.gain.setValueAtTime(v,t0+s);
   g.gain.exponentialRampToValueAtTime(.01,t0+s+d);
   o.start(t0+s);o.stop(t0+s+d+.02);
  });
 }catch(e){}
}
function vibrate(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}

function toggleFullScreen(){
 const el=document.documentElement;
 if(!document.fullscreenElement&&!document.webkitFullscreenElement){
  const r=el.requestFullscreen||el.webkitRequestFullscreen;
  if(r){const p=r.call(el);if(p&&p.catch)p.catch(()=>{})}
 }else{const x=document.exitFullscreen||document.webkitExitFullscreen;if(x)x.call(document)}
}
function updateFsIcon(){
 const on=document.fullscreenElement||document.webkitFullscreenElement;
 document.getElementById('fs-icon').className=on?'fa-solid fa-compress':'fa-solid fa-expand';
}
document.addEventListener('fullscreenchange',updateFsIcon);
document.addEventListener('webkitfullscreenchange',updateFsIcon);

let wakeLock=null;
async function requestWakeLock(){try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWakeLock(){try{if(wakeLock)wakeLock.release()}catch(e){}wakeLock=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&isPlaying)requestWakeLock()});

async function enableTilt(){
 if(!tiltSupported||!tiltOn)return false;
 try{
  if(typeof DeviceOrientationEvent.requestPermission==='function'){
   const r=await DeviceOrientationEvent.requestPermission();
   if(r!=='granted')return false;
  }
  if(!tiltListening){window.addEventListener('deviceorientation',onTilt);tiltListening=true}
  return true;
 }catch(e){return false}
}
function onTilt(e){
 if(e.beta==null||e.gamma==null)return;
 if(!isPlaying||!tiltActive)return;
 const b=e.beta*Math.PI/180,g=e.gamma*Math.PI/180;
 const z=Math.cos(g)*Math.cos(b);
 if(!tiltArmed){
  if(Math.abs(z)<0.3){tiltArmed=true;playSound('armed')}
  return;
 }
 if(z<-0.55){tiltArmed=false;handleCorrect()}
 else if(z>0.55){tiltArmed=false;handleSkip()}
}

Object.values(themes).forEach(t=>{const seen=new Set();t.words=t.words.filter(w=>{const k=w.toLowerCase();if(seen.has(k))return false;seen.add(k);return true})});

let selectedTheme='darksouls1',gameTime=60,currentWords=[],currentIndex=0,scoreCorrect=0,scoreSkipped=0,streak=0,
 wordHistoryList=[],timerInterval=null,countdownTimeout=null,endTime=0,timeLeft=60,
 isPlaying=false,isCounting=false,lastAction=0,lastShownWord=null;

function loadPrefs(){try{
 const t=localStorage.getItem('souls_theme'),s=parseInt(localStorage.getItem('souls_time'),10);
 if(t&&themes[t])selectedTheme=t;if([30,60,90,120].includes(s))gameTime=s;
 if(localStorage.getItem('souls_sound')==='0')soundOn=false;
 if(localStorage.getItem('souls_tilt')==='0')tiltOn=false;
 if(localStorage.getItem('souls_touch')==='0')touchOn=false;
}catch(e){}}
function savePrefs(){try{localStorage.setItem('souls_theme',selectedTheme);localStorage.setItem('souls_time',String(gameTime))}catch(e){}}

function addEmbers(el){
 const em=['🔥','✨','✦','✧','▪','▫'];
 for(let i=0;i<10;i++){
  const s=document.createElement('span');s.className='bub';s.textContent=em[i%em.length];
  s.style.left=(Math.random()*94)+'%';s.style.fontSize=(12+Math.random()*16)+'px';
  s.style.animationDuration=(8+Math.random()*8)+'s';s.style.animationDelay=(-Math.random()*12)+'s';
  el.prepend(s);
 }
}

function initThemes(){
 const box=$('themes-container');box.innerHTML='';
 for(const [key,t] of Object.entries(themes)){
  const b=document.createElement('button');
  b.className='card tile'+(key===selectedTheme?' sel':'');
  b.onclick=()=>{selectedTheme=key;savePrefs();playSound('click');initThemes()};
  const ico=document.createElement('div');ico.className='ico';
  ico.style.background=`linear-gradient(135deg,${t.c[0]},${t.c[1]})`;
  ico.innerHTML=`<i class="fa-solid ${t.icon}"></i>`;
  const txt=document.createElement('div');
  const n=document.createElement('b');n.textContent=t.name;
  const s=document.createElement('small');s.textContent=t.words.length+' termos';
  txt.append(n,s);b.append(ico,txt);box.appendChild(b);
 }
 const sel=box.querySelector('.sel');if(sel&&sel.scrollIntoView)sel.scrollIntoView({block:'nearest'});
}
function setTime(sec){
 gameTime=sec;savePrefs();playSound('click');
 document.querySelectorAll('.time-btn').forEach(b=>b.classList.toggle('sel',parseInt(b.dataset.time,10)===sec));
}
function shuffleArray(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}

async function startCountdown(){
 if(isCounting||isPlaying)return;
 isCounting=true;
 
 initAudio();
 playSound('click');

 tiltActive=false;tiltArmed=false;
 const hint=$('hint');
 
 let infoText='';
 if(tiltOn&&touchOn)infoText='<i class="fa-solid fa-mobile-screen"></i> Giroscópio ou Swipe ativo';
 else if(tiltOn)infoText='<i class="fa-solid fa-mobile-screen"></i> Incline para frente (acertar) ou para trás (pular)';
 else if(touchOn)infoText='<i class="fa-solid fa-hand-pointer"></i> Toque na tela ou deslize';
 else infoText='<i class="fa-solid fa-triangle-exclamation"></i> Usando botões de toque da tela.';
 
 hint.innerHTML=infoText;

 if(tiltOn){
  const ok=await enableTilt();
  tiltActive=ok;
  if(!ok&&tiltOn){
   hint.innerHTML+='<br><small style="color:#d98273">Giroscópio indisponível. Usando botões.</small>';
  }
 }

 currentWords=shuffleArray(themes[selectedTheme].words);
 currentIndex=0;scoreCorrect=0;scoreSkipped=0;streak=0;wordHistoryList=[];lastShownWord=null;
 $('setup-screen').classList.add('hidden');
 const cs=$('countdown-screen');cs.classList.remove('hidden');
 let count=3;const num=$('countdown-number');num.innerText=count;playSound('beep');vibrate(30);
 const step=()=>{
  count--;
  if(count>0){num.innerText=count;playSound('beep');vibrate(30)}
  else if(count===0){num.innerText='LUTA!';playSound('start');vibrate([60,40,60])}
  else{cs.classList.add('hidden');isCounting=false;startGame();return}
  countdownTimeout=setTimeout(step,1000);
 };
 countdownTimeout=setTimeout(step,1000);
}

function startGame(){
 isPlaying=true;lastAction=0;tiltArmed=false;requestWakeLock();
 const gs=$('game-screen');gs.classList.remove('hidden');
 $('current-theme-label').innerText=themes[selectedTheme].name;
 $('live-score').innerText='0';$('timer-box').classList.remove('urgent');
 timeLeft=gameTime;$('timer-display').innerText=timeLeft;
 showNextWord('ok');
 endTime=Date.now()+gameTime*1000;
 timerInterval=setInterval(()=>{
  const r=Math.max(0,Math.ceil((endTime-Date.now())/1000));
  if(r!==timeLeft){
   timeLeft=r;$('timer-display').innerText=r;
   if(r<=10&&r>0){$('timer-box').classList.add('urgent');playSound(r<=3?'tick3':'tick')}
  }
  if(r<=0)endGame(true);
 },200);
}
function showNextWord(kind){
 if(currentIndex>=currentWords.length){
  currentWords=shuffleArray(themes[selectedTheme].words);currentIndex=0;
  if(currentWords.length>1&&currentWords[0]===lastShownWord)[currentWords[0],currentWords[1]]=[currentWords[1],currentWords[0]];
 }
 lastShownWord=currentWords[currentIndex];
 const el=$('word-display');el.textContent=lastShownWord;
 el.classList.remove('in-ok','in-skip');void el.offsetWidth;el.classList.add(kind==='skip'?'in-skip':'in-ok');
}
function canAct(){
 if(!isPlaying)return false;
 const n=Date.now();if(n-lastAction<350)return false;
 lastAction=n;return true;
}
function flash(color){
 const f=$('flash');f.style.background=color;f.style.opacity='.4';
 setTimeout(()=>{f.style.opacity='0'},170);
}
function feedback(text,color){
 const f=$('fb');f.textContent=text;f.style.color=color;
 f.classList.remove('show');void f.offsetWidth;f.classList.add('show');
}
function burst(emojis){
 for(let i=0;i<10;i++){
  const p=document.createElement('span');p.className='part';p.textContent=emojis[i%emojis.length];
  const a=Math.random()*Math.PI*2,d=80+Math.random()*110;
  p.style.left='50%';p.style.top='45%';p.style.fontSize=(14+Math.random()*14)+'px';
  p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+'px');
  document.body.appendChild(p);setTimeout(()=>p.remove(),800);
 }
}
function handleCorrect(){
 if(!canAct())return;
 scoreCorrect++;streak++;
 wordHistoryList.push({word:currentWords[currentIndex],status:'correct'});
 $('live-score').innerText=scoreCorrect;
 const sb=$('score-box');sb.classList.remove('bump');void sb.offsetWidth;sb.classList.add('bump');
 flash('#125c3a');vibrate(40);
 if(streak>=3&&streak%3===0){playSound('combo');feedback('🔥 Brasa x'+streak+'!','#ffd700');burst(['🔥','✦','⚡'])}
 else{playSound('correct');feedback('LOUVADO SEJA!','#80d9a7');burst(['✨','✦','🔥'])}
 currentIndex++;showNextWord('ok');
}
function handleCorrectClick(){
 if(touchOn) handleCorrect();
}
function handleSkip(){
 if(!canAct())return;
 playSound('skip');scoreSkipped++;streak=0;
 wordHistoryList.push({word:currentWords[currentIndex],status:'skipped'});
 flash('#5c221a');vibrate([30,30,30]);feedback('DESPREZADO','#d98273');
 const g=$('game-screen');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake');
 currentIndex++;showNextWord('skip');
}

let tY=0,tX=0;
window.addEventListener('touchstart',e=>{
 if(!isPlaying||!touchOn)return;
 tY=e.changedTouches[0].screenY;
 tX=e.changedTouches[0].screenX;
},{passive:true});

window.addEventListener('touchend',e=>{
 if(!isPlaying||!touchOn)return;
 const dy=e.changedTouches[0].screenY-tY,dx=e.changedTouches[0].screenX-tX;
 if(Math.max(Math.abs(dx),Math.abs(dy))<40)return;
 const good=Math.abs(dy)>=Math.abs(dx)?dy>0:dx>0;
 good?handleCorrect():handleSkip();
},{passive:true});

function confetti(){
 const em=['🔥','✨','✦','▪','⚔','🛡'];
 for(let i=0;i<25;i++){
  const s=document.createElement('span');s.className='confetti';s.textContent=em[i%em.length];
  s.style.left=Math.random()*96+'vw';s.style.fontSize=(14+Math.random()*16)+'px';
  s.style.animationDuration=(2.2+Math.random()*2)+'s';s.style.animationDelay=(Math.random()*.8)+'s';
  document.body.appendChild(s);setTimeout(()=>s.remove(),5400);
 }
}
function countUp(el,to){
 el.innerText='0';if(!to)return;
 let n=0;const step=Math.max(60,Math.min(140,900/to));
 const iv=setInterval(()=>{n++;el.innerText=n;if(n>=to)clearInterval(iv)},step);
}
function endGame(timeUp){
 if(!isPlaying)return;
 isPlaying=false;tiltArmed=false;clearInterval(timerInterval);releaseWakeLock();
 $('game-screen').classList.add('hidden');
 $('result-screen').classList.remove('hidden');
 $('res-title').innerText=scoreCorrect>=8?'Gloriosa Vitória!':'Fim de Linha';
 $('res-sub').innerText=scoreCorrect>=8?'Sua lenda ecoará por toda Lorn...':scoreCorrect>0?'A brasa ainda fumega...':'Você morreu (You Died)';
 countUp($('res-correct'),scoreCorrect);countUp($('res-skipped'),scoreSkipped);
 const box=$('word-history');box.innerHTML='';
 if(!wordHistoryList.length){
  const p=document.createElement('p');p.style.cssText='text-align:center;font-size:.75rem;opacity:.6';
  p.textContent='Nenhum termo evocado.';box.appendChild(p);
 }else{
  wordHistoryList.forEach((it,i)=>{
   const ok=it.status==='correct';
   const row=document.createElement('div');row.className='row';row.style.animationDelay=Math.min(i*40,800)+'ms';
   const w=document.createElement('span');w.textContent=it.word;
   const c=document.createElement('span');c.className='chip '+(ok?'ok':'no');c.textContent=ok?'Acertou':'Pulou';
   row.append(w,c);box.appendChild(row);
  });
 }
 if(timeUp)playSound('buzz');
 setTimeout(()=>playSound(scoreCorrect>0?'win':'lose'),timeUp?500:0);
 if(scoreCorrect>0)confetti();
}
function returnToMenu(){
 $('result-screen').classList.add('hidden');
 $('setup-screen').classList.remove('hidden');
 playSound('click');initThemes();
}
window.onload=()=>{
 loadPrefs();refreshOpts();initThemes();setTime(gameTime);
 ['setup-screen','countdown-screen','result-screen'].forEach(id=>addEmbers($(id)));
};
